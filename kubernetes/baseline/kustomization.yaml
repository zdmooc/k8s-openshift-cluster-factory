apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pod Security Admission labels are carried by namespaces/platform.yaml.
# Do not add pod-security/psa-labels.yaml here: it declares the same Namespace
# and would create a duplicate resource ID during Kustomize rendering.
resources:
  - namespaces/platform.yaml
  - quotas/platform-quota.yaml
  - limitranges/platform-limitrange.yaml
  - networkpolicies/default-deny.yaml
  - rbac/platform-readonly.yaml
