apiVersion: factory.mayabank.example/v1alpha1
kind: ClusterProfile
metadata:
  name: rke2-lab-standard
  description: RKE2 lab reference profile intended for future Rancher-managed runtime validation.
spec:
  platform: rke2
  environment: sandbox
  evidenceTarget: REFERENCE
  topology:
    controlPlane: 3
    workers: 2
  network:
    podCIDR: 10.42.0.0/16
    serviceCIDR: 10.43.0.0/16
    policy: default-deny
  storage:
    class: local-path
    snapshots: false
  security:
    podSecurity: restricted
    policyEngine: kyverno
  lifecycle:
    upgradeChannel: stable
    backupRequired: true
  features:
    - rancher-management-ready
    - etcd-snapshot-design
    - baseline
