apiVersion: factory.mayabank.example/v1alpha1
kind: ClusterProfile
metadata:
  name: ocp-prod-critical
  description: Critical OpenShift production reference profile; not runtime-proven by this repository.
spec:
  platform: openshift
  environment: prod
  evidenceTarget: REFERENCE
  topology:
    controlPlane: 3
    workers: 6
  network:
    podCIDR: 10.128.0.0/14
    serviceCIDR: 172.30.0.0/16
    policy: default-deny
  storage:
    class: managed-csi
    snapshots: true
  security:
    podSecurity: restricted
    policyEngine: kyverno
  lifecycle:
    upgradeChannel: stable
    backupRequired: true
  features:
    - baseline
    - n-plus-one-capacity
    - disaster-recovery-design
    - audit-evidence
