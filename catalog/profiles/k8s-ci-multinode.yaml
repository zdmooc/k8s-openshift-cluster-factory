apiVersion: factory.mayabank.example/v1alpha1
kind: ClusterProfile
metadata:
  name: k8s-ci-multinode
  description: Ephemeral Kind cluster used to prove cluster factory lifecycle in CI.
spec:
  platform: kubernetes-kind
  environment: ci
  evidenceTarget: CI_RUNTIME_PROVEN
  topology:
    controlPlane: 1
    workers: 2
  network:
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/16
    policy: default-deny
  storage:
    class: standard
    snapshots: false
  security:
    podSecurity: baseline
    policyEngine: none
  lifecycle:
    upgradeChannel: pinned-kind-image
    backupRequired: false
  features:
    - baseline
    - healthcheck
    - evidence-export
